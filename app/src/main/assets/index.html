body {

header {

.core {
  width: 210px;
  height: 210px;
  margin: 35px auto;
  border-radius: 50%;
  border: 2px solid #29caff;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 20px #008cff,
              inset 0 0 25px #008cff;
  animation: glow 3s infinite alternate;
  position: relative;
}

.core::before {
  content: "";
  position: absolute;
  inset: 13px;
  border: 2px dashed #3acfff;
  border-radius: 50%;
  animation: rotate 12s linear infinite;
}

.core::after {
  content: "";
  position: absolute;
  inset: 32px;
  border: 2px solid #168dff;
  border-radius: 50%;
  animation: rotate 7s linear infinite reverse;
}

.core span {
  font-size: 42px;
  color: #5eeaff;
  text-shadow: 0 0 20px #00bfff;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

@keyframes glow {
  from { box-shadow: 0 0 12px #008cff; }
  to { box-shadow: 0 0 35px #00cfff,
                   inset 0 0 30px #008cff; }
}

.panel {
  width: 90%;

  border-radius: 15px;

}

.ring-one {
  border-top-color: #8ceeff;

.ring-two {
  inset: 28px;

}

.ring-three {
  inset: 45px;

<body>

  <h1>A.Y.R.A.</h1>
  <div class="maker-credit">MADE BY Ｉ Ｑ Ｏ Ｏ &nbsp; Ｒ Ａ Ｑ Ｉ Ｂ ✓</div>
  <div class="subtitle">PERSONAL AI ASSISTANT</div>
</header>

<div class="status" id="status">
  SYSTEM ONLINE
</div>


<div class="hud-stage" id="hudStage">

  
<div class="core" id="core">
  <canvas id="coreCanvas"></canvas>
</div>


</div>
<div class="panel">
  <h3>COMMUNICATION LOG</h3>
  <div id="chat">
    <div class="message jarvis">
      AYRA: Hello! System initialized.
      Awaiting your command.
    </div>
  </div>
</div>

<div class="panel text-panel">
  <h3>TEXT INPUT</h3>
  <div style="display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;">
    <textarea id="textInput" rows="2"
      placeholder="Type your message to AYRA..."
      style="flex:1;min-width:180px;resize:vertical;
      background:#00100a;color:#8affb5;border:1px solid #38d878;
      border-radius:6px;padding:12px;font-size:16px;"></textarea>
    <button id="sendText" type="button"
      style="background:#06351e;color:#8affb5;
      border:1px solid #38d878;border-radius:6px;
      padding:12px 20px;font-weight:bold;">SEND</button>
  </div>
</div>

<div class="panel voice-panel">
  <h3>VOICE LISTENING</h3>
  <p id="voiceStatus">Voice system is OFF. Press START.</p>
  <div class="voice-controls">
    <button id="startVoice" type="button">START</button>
    <button id="stopVoice" type="button">STOP</button>
    <button id="clearHistory" type="button">CLEAR HISTORY</button>
  </div>
</div>

<footer>
  AYRA INTERFACE v1.0<br>
  ANDROID PERSONAL AI PROJECT
</footer>

<script>
const statusText = document.getElementById("status");
const voiceStatus = document.getElementById("voiceStatus");
const chat = document.getElementById("chat");
const textInput = document.getElementById("textInput");
const sendText = document.getElementById("sendText");

function sendTextMessage() {
  const message = textInput.value.trim();
  if (!message || busy) return;
  textInput.value = "";
  processCommand(message, "text");
}

sendText.addEventListener("click", sendTextMessage);
textInput.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendTextMessage();
  }
});

let recognition = null;
let recognitionRunning = false;
let shouldListen = false;
let busy = false;
let restartTimer = null;
let sessionId = 0;

let savedUserName = localStorage.getItem("jarvis_user_name") || "";

function captureUserName(message) {
  const invalidNames = ["kya", "agar pata", "pata", "batao", "kaun", "naam"];

  if (savedUserName && invalidNames.includes(savedUserName.trim().toLowerCase())) {
    savedUserName = "";
    localStorage.removeItem("jarvis_user_name");
  }

  const patterns = [
    /^my\s+name\s+is\s+([a-z][a-z'-]{1,29}(?:\s+[a-z][a-z'-]{1,29})?)\s*[.!]?\s*$/i,
    /^mera\s+naam\s+([a-z][a-z'-]{1,29}(?:\s+[a-z][a-z'-]{1,29})?)\s+hai\s*[.!]?\s*$/i,
    /^call\s+me\s+([a-z][a-z'-]{1,29}(?:\s+[a-z][a-z'-]{1,29})?)\s*[.!]?\s*$/i
  ];

  const input = message.trim();

  for (const pattern of patterns) {
    const match = input.match(pattern);

    if (match) {
      const name = match[1].trim();

      if (
        name.length >= 2 &&
        name.length <= 30 &&
        !invalidNames.includes(name.toLowerCase())
      ) {
        savedUserName = name;
        localStorage.setItem("jarvis_user_name", savedUserName);
        return true;
      }
    }
  }

  return false;
}
let conversationHistory = [];
try {
  conversationHistory = JSON.parse(
    localStorage.getItem("jarvis_conversation") || "[]"
  );
  if (!Array.isArray(conversationHistory)) conversationHistory = [];
} catch (e) {
  conversationHistory = [];
}

function saveConversation() {
  try {
    localStorage.setItem(
      "jarvis_conversation",
      JSON.stringify(conversationHistory.slice(-100))
    );
  } catch (e) {
    voiceStatus.textContent = "Unable to save conversation history.";
  }
}

function addMessage(sender, message, type = "jarvis") {
  const div = document.createElement("div");
  div.className = "message " + type;
  const label = document.createElement("b");
  label.textContent = sender + ": ";
  div.appendChild(label);
  div.appendChild(document.createTextNode(message));
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function recordMessage(role, message) {
  conversationHistory.push({role, content: message});
  conversationHistory = conversationHistory.slice(-100);
  saveConversation();
  addMessage(
    role === "user" ? "YOU" : "AYRA",
    message,
    role === "user" ? "user" : "jarvis"
  );
}

function renderHistory() {
  chat.innerHTML = "";
  if (!conversationHistory.length) {
    addMessage("AYRA", "Hello! System initialized. Ready when you are.");
    return;
  }
  conversationHistory.forEach(item => {
    addMessage(
      item.role === "user" ? "YOU" : "AYRA",
      item.content,
      item.role === "user" ? "user" : "jarvis"
    );
  });
}

function startRecognition() {
  if (!shouldListen || busy || !recognition || recognitionRunning) return;
  try {
    recognition.start();
  } catch (e) {}
}

function speak(message, onDone, currentSession) {
  if (currentSession !== sessionId) return;

  if (!("speechSynthesis" in window)) {
    if (onDone) onDone();
    return;
  }

  window.speechSynthesis.cancel();
  if (recognition && recognitionRunning) {
    try { recognition.stop(); } catch (e) {}
  }

  const speech = new SpeechSynthesisUtterance(message);
  speech.lang = "hi-IN";
  speech.rate = 0.88;
  speech.pitch = 1.18;

  const voices = window.speechSynthesis.getVoices();

  if (!window.ayraSelectedVoice && voices.length > 0) {
    const femaleVoices = voices.filter(v =>
      /female|woman/i.test(v.name)
    );

    const hindiFemale = femaleVoices.find(v =>
      /^hi(-|_)?in/i.test(v.lang)
    );

    const englishFemale = femaleVoices.find(v =>
      /^en(-|_)?/i.test(v.lang)
    );

    window.ayraSelectedVoice =
      hindiFemale || englishFemale || null;
  }

  if (window.ayraSelectedVoice) {
    speech.voice = window.ayraSelectedVoice;
    speech.lang = window.ayraSelectedVoice.lang;
  } else {
    speech.lang = "hi-IN";
  }

  let finished = false;
  function finish() {
    if (finished) return;
    finished = true;
    if (currentSession === sessionId && onDone) onDone();
  }

  speech.onend = finish;
  speech.onerror = finish;
  window.speechSynthesis.speak(speech);
}

async function processCommand(command, source = "voice") {
  if (!command.trim() || busy || (source === "voice" && !shouldListen)) return;

  busy = true;
  const currentSession = sessionId;

  if (recognition && recognitionRunning) {
    try { recognition.stop(); } catch (e) {}
  }

  recordMessage("user", command);
  captureUserName(command);
  addMessage("AYRA", "Thinking...", "jarvis");
  statusText.textContent = "PROCESSING";
  voiceStatus.textContent = "Processing your command...";

  try {
    const previousHistory = conversationHistory.slice(0, -1).slice(-12);

    const response = await fetch("http://127.0.0.1:8001/chat", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        message: command,
        history: previousHistory,
        user_name: savedUserName
      })
    });

    const data = await response.json();

    if (currentSession !== sessionId) return;

    const messages = document.querySelectorAll(".message");
    const last = messages[messages.length - 1];
    if (last && last.textContent.includes("Thinking...")) last.remove();

    if (!response.ok) {
      throw new Error(data.detail || "Server error " + response.status);
    }

    const reply = data.reply || "I did not receive a reply.";
    recordMessage("assistant", reply);

    speak(reply, () => {
      busy = false;
      statusText.textContent = "SYSTEM ONLINE";

      if (shouldListen) {
        voiceStatus.textContent = "Listening... Speak normally.";
        startRecognition();
      } else {
        voiceStatus.textContent = "Voice system is OFF. Text chat is ready.";
      }
    }, currentSession);

  } catch (error) {
    if (currentSession !== sessionId) return;

    const messages = document.querySelectorAll(".message");
    const last = messages[messages.length - 1];
    if (last && last.textContent.includes("Thinking...")) last.remove();

    recordMessage("assistant", "Connection error: " + error.message);
    busy = false;
    statusText.textContent = "SYSTEM ONLINE";
    voiceStatus.textContent = shouldListen
      ? "Listening... You can try again."
      : "Voice system is OFF. Press START.";
    if (shouldListen) startRecognition();
  }
}

function handleSpeech(text) {
  if (!text.trim() || busy || !shouldListen) return;

  const command = text.toLowerCase()
    .replace(/[.,!?]/g, "")
    .replace(/\\s+/g, " ")
    .trim();

  const stopCommands = [
    "stop",
    "ayra stop",
    "hey ayra stop",
    "stop listening",
    "ayra stop listening",
    "mic off",
    "microphone off",
    "turn off microphone",
    "microphone band karo",
    "mic band karo",
    "listening band karo",
    "sunna band karo",
    "ruk jao"
  ];

  if (stopCommands.includes(command)) {
    addMessage("YOU", text, "user");
    stopListening();
    addMessage("AYRA", "Microphone stopped. Press START to listen again.");
    return;
  }

  processCommand(text);
}

function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    shouldListen = false;
    voiceStatus.textContent = "Speech recognition unavailable. Use Chrome.";
    statusText.textContent = "VOICE UNAVAILABLE";
    return;
  }

  if (!recognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      recognitionRunning = true;
      voiceStatus.textContent = "Listening... Speak normally.";
      statusText.textContent = "VOICE ACTIVE";
    };

    recognition.onresult = event => {
      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          const spokenText = event.results[i][0].transcript.trim();
          if (spokenText) handleSpeech(spokenText);
        }
      }
    };

    recognition.onerror = event => {
      voiceStatus.textContent = "Microphone error: " + event.error;
      if (event.error === "not-allowed" ||
          event.error === "service-not-allowed") {
        shouldListen = false;
        statusText.textContent = "MICROPHONE PERMISSION REQUIRED";
      }
    };

    recognition.onend = () => {
      recognitionRunning = false;
      if (restartTimer) clearTimeout(restartTimer);
      if (shouldListen && !busy) {
        restartTimer = setTimeout(() => {
          restartTimer = null;
          startRecognition();
        }, 800);
      }
    };
  }

  startRecognition();
}

function stopListening() {
  shouldListen = false;
  sessionId++;
  busy = false;

  if (restartTimer) clearTimeout(restartTimer);
  restartTimer = null;

  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }

  if (recognition) {
    recognition.onend = null;
    try { recognition.stop(); } catch (e) {}
    recognition = null;
  }

  recognitionRunning = false;
  voiceStatus.textContent = "Voice system stopped.";
  statusText.textContent = "SYSTEM STANDBY";
}

function clearChat() {
  conversationHistory = [];
  saveConversation();
  chat.innerHTML = "";
  addMessage("AYRA", "Conversation history cleared.");
}

document.getElementById("startVoice").addEventListener("click", () => {
  if (shouldListen) return;
  sessionId++;
  shouldListen = true;
  busy = false;
  voiceStatus.textContent = "Starting microphone...";
  startListening();
});

document.getElementById("stopVoice").addEventListener("click", stopListening);
document.getElementById("clearHistory").addEventListener("click", clearChat);

renderHistory();

window.addEventListener("load", () => {
  voiceStatus.textContent = "Voice system is OFF. Press START.";
  statusText.textContent = "SYSTEM STANDBY";
});
</script>


<script type="module">
(async () => {
  const canvas = document.getElementById("coreCanvas");
  if (!canvas) return;

  try {
    const THREE = await import(
      "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    );

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
    camera.position.z = 5;

    const renderer = new THREE.WebGLRenderer({
      canvas,
      alpha: true,
      antialias: true
    });

    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
    renderer.setClearColor(0x000000, 0);

    scene.add(new THREE.AmbientLight(0x8bdfff, 2));

    const light1 = new THREE.PointLight(0x00aaff, 90, 12);
    light1.position.set(2, 2, 3);
    scene.add(light1);

    const light2 = new THREE.PointLight(0x0088ff, 65, 12);
    light2.position.set(-2, -2, 2);
    scene.add(light2);

    const core = new THREE.Group();
    scene.add(core);

    // Central blue energy sphere
    const orb = new THREE.Mesh(
      new THREE.SphereGeometry(0.65, 48, 48),
      new THREE.MeshPhysicalMaterial({
        color: 0x087dff,
        emissive: 0x0066ff,
        emissiveIntensity: 1.8,
        metalness: 0.5,
        roughness: 0.17,
        clearcoat: 1
      })
    );
    core.add(orb);

    // Bright energy centre
    const energy = new THREE.Mesh(
      new THREE.SphereGeometry(0.25, 32, 32),
      new THREE.MeshBasicMaterial({
        color: 0x9cf5ff
      })
    );
    core.add(energy);

    function makeRing(radius, thickness, color, x, y, z) {
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(radius, thickness, 12, 100),
        new THREE.MeshStandardMaterial({
          color: color,
          emissive: color,
          emissiveIntensity: 1.8,
          metalness: 0.8,
          roughness: 0.2
        })
      );

      ring.rotation.set(x, y, z);
      core.add(ring);
      return ring;
    }

    const rings = [
      makeRing(0.95, 0.025, 0x48dfff, 1.0, 0.2, 0),
      makeRing(1.12, 0.018, 0x087dff, 0.2, 1.1, 0.5),
      makeRing(1.27, 0.014, 0x9cefff, 1.4, 0.4, 0.2),
      makeRing(0.78, 0.018, 0x168cff, 0.6, 0.8, 1.0)
    ];

    // Small floating holographic particles
    const count = 220;
    const coords = [];

    for (let i = 0; i < count; i++) {
      const radius = 1.35 + Math.random() * 0.5;
      const angle = Math.random() * Math.PI * 2;
      const height = (Math.random() - 0.5) * 2.5;

      coords.push(
        Math.cos(angle) * radius,
        height,
        Math.sin(angle) * radius
      );
    }

    const geometry = new THREE.BufferGeometry();
    geometry.setAttribute(
      "position",
      new THREE.Float32BufferAttribute(coords, 3)
    );

    const stars = new THREE.Points(
      geometry,
      new THREE.PointsMaterial({
        color: 0x71eaff,
        size: 0.025,
        transparent: true,
        opacity: 0.9,
        blending: THREE.AdditiveBlending
      })
    );

    core.add(stars);

function resize() {
      const w = canvas.clientWidth || 260;
      const h = canvas.clientHeight || 260;

      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    if ("ResizeObserver" in window) {
      new ResizeObserver(resize).observe(canvas);
    } else {
      window.addEventListener("resize", resize);
    }

    resize();

    let previous = 0;

    function animate(time) {
      requestAnimationFrame(animate);

      const dt = Math.min((time - previous) / 1000 || 0, 0.05);
      previous = time;

      core.rotation.y += dt * 0.45;
      core.rotation.x += dt * 0.12;

      rings[0].rotation.z += dt * 0.4;
      rings[1].rotation.x += dt * 0.35;
      rings[2].rotation.y -= dt * 0.3;
      rings[3].rotation.z -= dt * 0.5;

      stars.rotation.y += dt * 0.08;

      const pulse = 1 + Math.sin(time * 0.002) * 0.035;
      orb.scale.setScalar(pulse);

      renderer.render(scene, camera);
    }

    requestAnimationFrame(animate);

  } catch (error) {
    console.error("AYRA 3D error:", error);
    button.textContent = "3D CORE LOAD ERROR";
  }
})();
</script>
